name: Bug report
description: Report something that isn't working as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please search existing issues first.
        **Security vulnerabilities must be reported privately** — see the Security tab.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run '...'
        2. Open '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include error messages or stack traces if any.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: e.g. v1.2.0 or a1b2c3d

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, runtime versions (PHP, Node, Go…), browser, etc.
      placeholder: |
        - OS: Ubuntu 24.04
        - PHP: 8.4
        - Laravel: 12.x

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste logs here; they will be formatted as code automatically.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues and this is not a duplicate.
          required: true
